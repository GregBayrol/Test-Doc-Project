name: Publish documentation

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Determine version
        run: echo "DOC_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install Mermaid CLI
        run: npm install --global @mermaid-js/mermaid-cli

      - name: Install Pandoc and XeLaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-latex-extra

      - name: Prepare build directories
        run: |
          mkdir -p build
          mkdir -p dist/assets
          mkdir -p release

      - name: Render Mermaid diagrams
        run: |
          mmdc \
            -p templates/puppeteer-config.json \
            -i docs/specification.md \
            -o build/specification.md

      - name: Build HTML
        run: |
          pandoc build/specification.md \
            --standalone \
            --mathjax \
            --css=style.css \
            --resource-path=docs:build \
            -o dist/index.html

          cp templates/style.css dist/style.css
          cp -R docs/assets/. dist/assets/

      - name: Build PDF
        run: |
          pandoc build/specification.md \
            --pdf-engine=xelatex \
            --template=templates/pdf-template.tex \
            --resource-path=docs:build \
            -o "release/specification-${DOC_VERSION}.pdf"

      - name: Prepare HTML release
        run: |
          cp dist/index.html \
            "release/specification-${DOC_VERSION}.html"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation-${{ env.DOC_VERSION }}
          path: release/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/specification-${{ env.DOC_VERSION }}.pdf
            release/specification-${{ env.DOC_VERSION }}.html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4