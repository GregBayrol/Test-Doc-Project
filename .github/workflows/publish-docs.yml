name: Publish documentation

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Determine version
        shell: bash
        run: |
          SAFE_VERSION=$(printf '%s' "${GITHUB_REF_NAME}" | sed 's#[^A-Za-z0-9._-]#-#g')
          echo "DOC_VERSION=${SAFE_VERSION}" >> "$GITHUB_ENV"

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install Mermaid CLI
        run: npm install --global --no-audit --no-fund @mermaid-js/mermaid-cli@12.0.0

      - name: Install document toolchain
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            fonts-dejavu-core \
            librsvg2-bin \
            pandoc \
            texlive-latex-extra \
            texlive-xetex \
            lmodern

      - name: Build and validate documentation
        run: bash scripts/build-docs.sh

      - name: Upload downloadable documentation
        uses: actions/upload-artifact@v7
        with:
          name: documentation-${{ env.DOC_VERSION }}
          path: release/
          if-no-files-found: error
          compression-level: 9

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/specification-${{ env.DOC_VERSION }}.pdf
            release/specification-${{ env.DOC_VERSION }}.html
          fail_on_unmatched_files: true

  deploy:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
